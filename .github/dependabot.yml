version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # AGP stays on what the installed Android Studio can sync; raise it by hand after updating Studio.
      - dependency-name: "com.android.*"
        versions: [">= 9.3.0"]
    groups:
      androidx-and-kotlin:
        patterns:
          - "androidx.*"
          - "org.jetbrains.kotlin*"
          - "com.android.*"
          - "com.google.devtools.ksp*"
      libraries:
        patterns:
          - "*"
        exclude-patterns:
          - "androidx.*"
          - "org.jetbrains.kotlin*"
          - "com.android.*"
          - "com.google.devtools.ksp*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
