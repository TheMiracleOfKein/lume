name: Bug report
description: Something in Lume doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If a single source stopped working (search, chapters or pages fail on one site), use the **Source problem** form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lume version
      description: Settings → About.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 6a, Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, screen recording or crash log
      description: Optional. Remove anything private (tokens, e-mail addresses) first.
