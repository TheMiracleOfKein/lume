name: Feature request
description: An idea for Lume.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/TheMiracleOfKein/lume/blob/main/docs/ROADMAP.md) first; it may already be planned. Requests for new sites are welcome too. Lume doesn't load Mihon/Tachiyomi extensions ([why](https://github.com/TheMiracleOfKein/lume/blob/main/docs/MIHON_EXTENSIONS.md)).
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: other
    attributes:
      label: Other apps that do it
      description: Optional.
