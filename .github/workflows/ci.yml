name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Live catalogue tests stay off (no -Plume.live; see live-sources.yml). The Room migration
      # test runs here on Robolectric; on Windows it only runs on a device.
      - name: Build, test and lint
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      # Screenshot tests: the screens are rendered again and compared with the golden images in
      # app/src/test/screenshots (docs/ARCHITECTURE.md, "Screenshot tests"). Plain unit tests
      # above skip the comparison.
      - name: Verify screenshots
        run: ./gradlew --no-configuration-cache :app:verifyRoborazziDebug --tests "com.lume.app.ui.screenshots.*"

      # If the comparison failed because the screens really changed (or Linux draws text slightly
      # differently), the images as drawn on CI can be downloaded and committed as the new goldens.
      - name: Record screenshots as drawn on CI
        if: failure()
        run: ./gradlew --no-configuration-cache :app:recordRoborazziDebug --tests "com.lume.app.ui.screenshots.*"

      - name: Upload recorded screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-recorded-on-ci
          path: app/src/test/screenshots/
          if-no-files-found: ignore

      # The R8-shrunk release build (unsigned here), so a missing keep rule fails the PR rather
      # than the release.
      - name: Release build (R8)
        run: ./gradlew --no-configuration-cache :app:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
