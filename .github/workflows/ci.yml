name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Live catalogue tests stay off (no -Plume.live; see live-sources.yml). The Room migration
      # test runs here on Robolectric; on Windows it only runs on a device.
      - name: Build, test and lint
        run: ./gradlew --no-configuration-cache :core:model:test :core:common:testDebugUnitTest :core:common:lintDebug :core:data:testDebugUnitTest :core:data:lintDebug :core:ui:testDebugUnitTest :core:ui:lintDebug :feature:comics:testDebugUnitTest :feature:comics:lintDebug :feature:novel:testDebugUnitTest :feature:novel:lintDebug :app:assembleDebug :app:testFullDebugUnitTest :app:testMangaDebugUnitTest :app:lintFullDebug :app:lintMangaDebug

      # Screenshot tests: the screens are rendered again and compared with the golden images in
      # core/ui/src/test/screenshots and feature/comics/src/test/screenshots (docs/ARCHITECTURE.md,
      # "Screenshot tests"). Plain unit tests above skip the comparison.
      - name: Verify screenshots
        run: ./gradlew --no-configuration-cache :core:ui:verifyRoborazziDebug :feature:comics:verifyRoborazziDebug --tests "com.lume.app.ui.screenshots.*"

      # If the comparison failed because the screens really changed (or Linux draws text slightly
      # differently), the images as drawn on CI can be downloaded and committed as the new goldens.
      - name: Record screenshots as drawn on CI
        if: failure()
        run: ./gradlew --no-configuration-cache :core:ui:recordRoborazziDebug :feature:comics:recordRoborazziDebug --tests "com.lume.app.ui.screenshots.*"

      - name: Upload recorded screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-recorded-on-ci
          path: |
            core/ui/src/test/screenshots/
            feature/comics/src/test/screenshots/
          if-no-files-found: ignore

      # The R8-shrunk release builds of both flavors (unsigned here), so a missing keep rule fails
      # the PR rather than the release.
      - name: Release build (R8)
        run: ./gradlew --no-configuration-cache :app:assembleFullRelease :app:assembleMangaRelease

      - name: APK sizes
        run: |
          {
            echo '## Release APK sizes'
            for apk in app/build/outputs/apk/*/release/*.apk; do
              echo "- \`$(basename "$apk")\`: $(stat -c %s "$apk") bytes"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/data/build/reports/tests/
            core/ui/build/reports/tests/
            feature/comics/build/reports/tests/
            app/build/reports/lint-results-fullDebug.html
            app/build/reports/lint-results-mangaDebug.html
            core/ui/build/outputs/roborazzi/
            feature/comics/build/outputs/roborazzi/
          if-no-files-found: ignore
