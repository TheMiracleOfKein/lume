name: Live sources

# Bundled sources against the real sites, weekly and on demand. Sites change without notice;
# this catches a broken source before users report it. Sources unreachable from GitHub's
# runners (region blocks, challenges that need a WebView) are reported as SKIP, not failures.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      sources:
        description: "Source ids to check, comma-separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    name: Live source checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check sources
        env:
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          args=(-Plume.live)
          if [ -n "$SOURCES" ]; then args+=("-Plume.live.sources=$SOURCES"); fi
          ./gradlew --no-configuration-cache :app:testDebugUnitTest --tests 'com.lume.app.data.source.LiveSourcesTest' "${args[@]}"

      - name: Report
        if: always()
        run: |
          {
            echo '## Live source report'
            echo '```'
            cat app/build/live-sources-report.txt 2>/dev/null || echo 'No report: the build failed before the check ran.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
