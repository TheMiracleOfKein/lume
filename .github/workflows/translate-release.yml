name: Translate release

# Builds, signs and publishes the Lume Translate add-on (translate-addon/) on its own release,
# apart from Lume's: tag translate-vX.Y.Z, asset lume-translate-vX.Y.Z.apk. The release is never
# marked as the latest, because Lume's own updater reads the latest release. Steps: docs/RELEASING.md.
on:
  push:
    tags: ["translate-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. translate-v2.0.0 (must already be pushed)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish the add-on
    if: github.event_name == 'workflow_dispatch' || vars.LUME_RELEASE_FROM_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CERT_SHA256: ${{ vars.LUME_CERT_SHA256 || 'b1594cec70301bfd0f66d73d82e9bdcea6355b8df8d2abe50e1fc022629bd565' }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$TAG" =~ ^translate-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not an add-on release tag like translate-v2.0.0"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # bergamot-translator, the engine, is a pinned submodule.
          submodules: recursive

      - name: Check the signing secrets
        env:
          KEYSTORE: ${{ secrets.LUME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LUME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUME_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing LUME_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing LUME_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing LUME_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing LUME_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Check the version matches the tag
        run: |
          name=$(sed -n 's/^lume\.translateVersionName=\(.*\)$/\1/p' gradle.properties | tr -d '\r')
          if [ "translate-v$name" != "$TAG" ]; then
            echo "::error::translateVersionName is $name but the tag is $TAG"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare the keystore
        env:
          KEYSTORE: ${{ secrets.LUME_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lume-release.jks"

      - name: Build the signed add-on APK
        env:
          ORG_GRADLE_PROJECT_LUME_STORE_FILE: ${{ runner.temp }}/lume-release.jks
          ORG_GRADLE_PROJECT_LUME_STORE_PASSWORD: ${{ secrets.LUME_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LUME_KEY_ALIAS: ${{ secrets.LUME_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LUME_KEY_PASSWORD: ${{ secrets.LUME_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :translate-addon:clean :translate-addon:assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lume-release.jks"

      - name: Check the signature and version
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          apk="translate-addon/build/outputs/apk/release/translate-addon-release.apk"
          [ -f "$apk" ] || { echo "::error::No signed add-on APK (only an unsigned one?)"; exit 1; }
          certs=$("$bt/apksigner" verify --print-certs -v "$apk")
          echo "$certs" | grep -q "^Verifies" || { echo "::error::apksigner does not verify the add-on APK"; exit 1; }
          echo "$certs" | grep -qi "SHA-256 digest: $CERT_SHA256" || { echo "::error::The add-on APK is signed with another certificate"; exit 1; }
          "$bt/aapt2" dump badging "$apk" | grep -q "versionName='${TAG#translate-v}'" || { echo "::error::The add-on APK has another version"; exit 1; }
          name="lume-$TAG.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          cat "dist/$name.sha256"
          echo "$name: $(stat -c %s "dist/$name") bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: lume-${{ env.TAG }}
          path: dist/

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; left as it is. The APK is in the workflow artifact."
            exit 0
          fi
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::No release notes at $notes"; exit 1; }
          gh release create "$TAG" "dist/lume-$TAG.apk" "dist/lume-$TAG.apk.sha256" \
            --title "Lume Translate ${TAG#translate-v}" --notes-file "$notes" --verify-tag --latest=false
